[build]
  command = "yarn workspace client build"
  publish = "client/dist"

# Pin the build environment to Node 20 (matches Railway's nixpacks nodejs_20) so
# the Netlify build can't drift onto a different Node version than we test with.
#
# This pin is why client/package.json holds livekit-client at an exact 2.22.0:
# 2.23 added a transitive dependency declaring engines.node >= 22.22, which
# yarn refuses to install here. Raising this to 22 would also mean raising
# nixpacks.toml, and rebuilding better-sqlite3 from source on a new Node is a
# bigger risk than staying a minor version behind on a WebRTC client.
[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to Railway — update the `to` URL after Railway deployment
[[redirects]]
  from   = "/api/*"
  to     = "https://server-production-2e32.up.railway.app/api/:splat"
  status = 200
  force  = true

# The two files that let an invite link open the app instead of the website.
# Apple's has no file extension, so without this it is served as
# application/octet-stream and iOS refuses it — the link then silently opens
# the website forever, which looks exactly like the feature not being built.
# Both must be served over HTTPS with no redirect.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# SPA fallback — all other routes serve index.html. Static files in the publish
# directory are matched first, so this does not shadow /.well-known.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

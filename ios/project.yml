# The iOS app is generated from this file with `xcodegen`, so the project is a
# readable diff rather than a pbxproj nobody can review. Run `xcodegen` in this
# directory after changing it; GuessTheList.xcodeproj is not committed.
name: GuessTheList

options:
  bundleIdPrefix: com.guessthelist
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0

targets:
  GuessTheList:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The .ttf files are resources, not code, so they are copied in rather
      # than compiled. Without the UIAppFonts list below they ship inside the
      # bundle and are never registered, and every Font.custom silently falls
      # back to the system face.
      - path: Sources/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: LiveKit
        product: LiveKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Tenable
        UILaunchScreen: {}
        # The same faces the web game loads from Google Fonts, bundled. These
        # are file names; Font.custom takes the PostScript name instead, which
        # is why Fonts.swift keeps the two in one place.
        UIAppFonts:
          - RussoOne-Regular.ttf
          - NotoSans-Regular.ttf
          - NotoSans-SemiBold.ttf
          - NotoSans-Bold.ttf
          - ChakraPetch-Regular.ttf
          - ChakraPetch-SemiBold.ttf
          - ChakraPetch-Bold.ttf
        # Both are required before the first capture call, and the strings are
        # shown to the person, so they say what the camera is actually for.
        NSCameraUsageDescription: Your camera is shared with the other players in your game.
        NSMicrophoneUsageDescription: Your microphone is shared with the other players in your game.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - voip
        # Declares that the app uses no NON-EXEMPT encryption, which stops
        # App Store Connect asking on every single upload.
        #
        # The basis: the only encryption here is HTTPS to the API and WebRTC's
        # DTLS-SRTP for the call. Both are standard, published algorithms
        # provided by the OS and the LiveKit SDK — nothing proprietary, and no
        # encryption of the user's own data at rest. That is the exemption.
        #
        # It is a legal declaration. If the app ever gains its own crypto, or
        # starts encrypting stored recordings with a key it manages, this has
        # to be revisited.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        # The only team with provisioning profiles on this machine. Not a
        # secret — it ships inside every signed binary — and without it every
        # device build needs the flag passing by hand.
        DEVELOPMENT_TEAM: QZA66MATSN
        CODE_SIGN_STYLE: Automatic
        # TestFlight rejects a build whose version it has seen before, so
        # MARKETING_VERSION is what people read and CURRENT_PROJECT_VERSION is
        # what must go up on every single upload. scripts/testflight.sh stamps
        # the latter from the clock so it cannot be forgotten.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Without this the build is fine, installs fine, and is then refused by
        # App Store Connect: an icon in an asset catalog plus the
        # CFBundleIconName the catalog generates are both required.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

[build]
  command = "yarn workspace client build"
  publish = "client/dist"

# Proxy API calls to Railway — update the `to` URL after Railway deployment
[[redirects]]
  from   = "/api/*"
  to     = "https://REPLACE_WITH_RAILWAY_URL/api/:splat"
  status = 200
  force  = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
